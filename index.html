function piano(f,t,v,d){if(S.mute)return;const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.002;l.type='lowpass';l.frequency.setValueAtTime(2400,t);l.frequency.exponentialRampToValueAtTime(500,t+(d||3));g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+(d||3));o.connect(l);o2.connect(l);l.connect(g);g.connect(MU.g);o.start(t);o2.start(t);o.stop(t+(d||3)+.1);o2.stop(t+(d||3)+.1)}
function pad(fs,t,dur,v,lp){if(S.mute)return;const g=AC.createGain(),l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=lp||650;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+dur*.35);g.gain.linearRampToValueAtTime(v*.8,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur+.4);l.connect(g);g.connect(MU.g);

function softZone(prog,dur,mel,oct){return{dur,step(i,t){const bar=Math.floor(i/8)%prog.length,ch=prog[bar],k=i%8;

  const arp=[0,1,2,3,2,1,null,null][k];if(arp!==null)piano(N(ch[arp]+(oct||0)),t,.022,3.2);
  const m=mel[i%mel.length];if(m!==null&&m!==undefined)mbox(N(m+12),t,.035);
  if(i%32===28)glass(N(ch[3]+24),t,5,.004)}}}

  A:{t:'開館前夜・一樓展廳',p:['你是何曉晴，文物修復師。','一週前，「月光文化」的沈小姐委託你：永生蠟像館封館三十八年，即將重新開館，請你在開館前一晚清點所有展品。','委託書上除了報酬，還有一欄奇怪的「制服尺寸」。你填了身高：162。','晚上十點，你從側門進來。側門在你身後自己關上了，從裡面打不開。'],
    radio:['（手機響了，是攝影師宋景）','「曉晴？我搭貨梯下來地下工坊拍照，結果貨梯斷電了。樓梯口……被焊死了。」','「這邊有一座送東西用的小升降梯，好像通到你那邊的大廳。人進不去，東西可以。」','「還有……這裡到處都是眼睛。玻璃做的。我希望是。」'],after:['委託人說，天亮會有人來開門。你不想等到天亮。',{cls:'sys',t:'左上角的畫筆可以打開共用畫板；右上角的麥克風可以跟宋景語音通話。'}]},

    radio:['（你打給修復師何曉晴）','「我被困在地下一樓。你那邊呢？」','曉晴：「我在一樓大廳。正門被鐵鍊鎖住了，側門也打不開。」','「這邊大廳牆上有一座送物升降梯……你那邊有嗎？」','你回頭。中庭的牆上，也有一座。'],after:['你們只能用升降梯傳東西。',{cls:'sys',t:'左上角的畫筆可以打開共用畫板；右上角的麥克風可以跟曉晴語音通話。'}]}};
